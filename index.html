 <!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Parts cost calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060606;--panel:#111010;--panel2:#171512;--line:#2b2518;--gold:#d4af37;--gold-hi:#f6dc8a;--gold-lo:#8d6c14;--ink:#f5f0e3;--mute:#a09a8a;--grad:linear-gradient(180deg,#f9e29a 0%,#d4af37 55%,#9a7716 100%);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"],:root[data-theme="dark"]{--bg:#060606}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(900px 380px at 50% -80px,rgba(212,175,55,.16),transparent 70%) no-repeat;color:var(--ink);font:16px/1.4 "DM Sans",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 110px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--line);position:relative}
header::after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:2px;background:var(--grad)}
h1{margin:0;font:700 clamp(30px,6vw,52px)/1 Oswald,"Arial Narrow",sans-serif;letter-spacing:.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:8px 0 0;color:var(--mute);max-width:46ch}
.count{border:1px solid var(--gold-lo);color:var(--gold-hi);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap;background:rgba(212,175,55,.08)}
.layout{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:960px){.layout{grid-template-columns:1fr 360px;align-items:start}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{border-color:var(--gold-lo)}
.card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 28px rgba(212,175,55,.2)}
.pic{display:block;width:100%;padding:0;border:0;background:#000;cursor:pointer}
.pic:active{transform:scale(.98)}
.pic img{display:block;width:100%;height:auto}
.badge{position:absolute;top:8px;left:8px;min-width:30px;height:30px;padding:0 9px;border-radius:15px;background:var(--grad);color:#120d00;font:700 16px/30px Oswald,sans-serif;text-align:center;display:none;box-shadow:0 2px 10px rgba(0,0,0,.6)}
.card.on .badge{display:block}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px 8px}
.name{font-weight:500;font-size:14px;text-transform:capitalize;line-height:1.2}
.price{color:var(--gold);font:600 16px Oswald,sans-serif;white-space:nowrap}
.ctl{display:grid;grid-template-columns:42px 1fr 42px;margin:0 10px 10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.ctl button{border:0;background:none;color:var(--gold);font:600 22px/1 "DM Sans",sans-serif;height:38px;cursor:pointer}
.ctl button:hover{background:rgba(212,175,55,.14)}
.ctl input{width:100%;min-width:0;border:0;background:none;color:var(--ink);text-align:center;font:600 17px "DM Sans",sans-serif;height:38px;-moz-appearance:textfield}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-hi);outline-offset:-2px}
.receipt{background:var(--panel);border:1px solid var(--gold-lo);border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6)}
@media(min-width:960px){.receipt{position:sticky;top:20px}}
.rh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(180deg,#1c1709,#121008);border-bottom:1px solid var(--gold-lo)}
.rh h2{margin:0;font:600 20px Oswald,sans-serif;letter-spacing:.03em;color:var(--gold-hi)}
.link{background:none;border:0;color:var(--mute);cursor:pointer;font:500 14px "DM Sans",sans-serif;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--gold-hi)}
textarea{display:block;width:100%;height:230px;resize:none;border:0;background:transparent;color:var(--ink);padding:16px 18px;font:14.5px/1.65 ui-monospace,Menlo,Consolas,monospace}
textarea::placeholder{color:#6f6a5c}
.rt{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px dashed var(--gold-lo)}
.rt span{color:var(--mute);font-weight:500}
.tot{font:700 36px/1 Oswald,sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rb{padding:0 18px 18px}
.copy{width:100%;height:50px;border:0;border-radius:10px;background:var(--grad);color:#120d00;font:700 17px "DM Sans",sans-serif;cursor:pointer;transition:filter .15s,transform .1s}
.copy:hover{filter:brightness(1.1)}.copy:active{transform:scale(.98)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:14px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(8,8,8,.94);border-top:1px solid var(--gold-lo);backdrop-filter:blur(8px)}
.bar .tot{font-size:30px}.bar .copy{width:auto;flex:1;max-width:220px;margin-left:auto}
@media(min-width:960px){.bar{display:none}.wrap{padding-bottom:40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<header><div><h1>Parts cost calculator</h1><p class="sub">Tap a picture to add one. Adjust amounts with − / + or type a number, then copy your list.</p></div><div class="count" id="cnt">0 items</div></header>
<div class="layout"><div class="grid" id="grid"></div>
<aside class="receipt"><div class="rh"><h2>Your order</h2><button class="link" id="clr">Clear all</button></div>
<textarea id="txt" readonly placeholder="Pick items to build your list."></textarea>
<div class="rt"><span>Total</span><div class="tot totv">$0</div></div>
<div class="rb"><button class="copy">Copy list</button></div></aside></div></div>
<div class="bar"><div class="tot totv">$0</div><button class="copy">Copy list</button></div>

const q={};const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("en-US");
const grid=$("grid");
ITEMS.forEach((it,i)=>{
 const c=document.createElement("div");c.className="card";
 c.innerHTML=`<span class="badge"></span><button class="pic" aria-label="Add ${it.name}"><img alt="${it.name}" src="${it.img}"></button><div class="meta"><span class="name">${it.name}</span><span class="price">$${fmt(it.price)}</span></div><div class="ctl"><button aria-label="Remove one">−</button><input type="number" min="0" value="0" inputmode="numeric" aria-label="${it.name} amount"><button aria-label="Add one">+</button></div>`;
 const [b2,b3]=c.querySelectorAll(".ctl button"),inp=c.querySelector("input");
 c.querySelector(".pic").onclick=b3.onclick=()=>set(i,(q[i]||0)+1);
 b2.onclick=()=>set(i,Math.max(0,(q[i]||0)-1));
 inp.oninput=()=>set(i,Math.max(0,parseInt(inp.value)||0),true);
 it.el=c;grid.appendChild(c);
});
function set(i,v,keep){q[i]=v;render(keep)}
function render(keep){
 let lines=[],total=0,kinds=0;
 ITEMS.forEach((it,i)=>{const n=q[i]||0,c=it.el;
  c.classList.toggle("on",n>0);c.querySelector(".badge").textContent=n;
  const inp=c.querySelector("input");if(!keep||document.activeElement!==inp)inp.value=n;
  if(n>0){const s=n*it.price;total+=s;kinds++;lines.push(`${n} * ${it.name}(${it.price}$) = ${s}$`)}});
 $("txt").value=lines.length?lines.join("\n")+`\n\ntotal is = ${total}$`:"";
 document.querySelectorAll(".totv").forEach(e=>e.textContent="$"+fmt(total));
 $("cnt").textContent=kinds+(kinds===1?" item":" items");
}
$("clr").onclick=()=>{for(const k in q)q[k]=0;render()};
document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{const t=$("txt").value;if(!t)return;
 try{await navigator.clipboard.writeText(t)}catch(e){$("txt").select();document.execCommand("copy")}
 document.querySelectorAll(".copy").forEach(x=>x.textContent="Copied ✓");
 setTimeout(()=>document.querySelectorAll(".copy").forEach(x=>x.textContent="Copy list"),1400)});
render();
</script></body></html>
